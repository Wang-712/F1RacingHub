# =============================================================
# HTTPS 版 Nginx 配置（证书申请成功后使用）
# 使用方式：将本文件覆盖到 nginx/default.conf，然后重启 frontend 容器
# =============================================================

# HTTP -> HTTPS 强制跳转
server {
    listen       80;
    server_name  F1RacingHub.com www.F1RacingHub.com;

    # Let's Encrypt 续签保留的验证路径
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务
server {
    listen       443 ssl http2;
    server_name  F1RacingHub.com www.F1RacingHub.com;

    # SSL 证书路径（通过 docker volume 挂载 /etc/letsencrypt -> 容器 /etc/nginx/ssl）
    ssl_certificate     /etc/nginx/ssl/live/F1RacingHub.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/F1RacingHub.com/privkey.pem;

    # SSL 安全加固
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（启用后浏览器一年内强制 HTTPS，确认无误后再开启）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 安全头
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # 同上：不使用 $uri/，避免与前端路由同名的物理目录导致 403
        try_files $uri /index.html;
    }

    # 静态资源长缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
