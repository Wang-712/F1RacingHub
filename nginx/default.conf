server {
    listen       80 default_server;
    server_name  _;

    # Docker 内置 DNS（用于动态解析 backend 服务名）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Let's Encrypt 证书验证路径（certbot --webroot 模式需要）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # SPA 路由回退：刷新子页面时返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的 JS/CSS/图片）
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代：/api/* -> backend:8000/api/*
    # 用 set 变量 + resolver 做延迟解析，避免 nginx 启动时 backend 未就绪导致启动失败
    # 注意：proxy_pass 用变量时 nginx 不做 URI 重写，需原样透传 $request_uri
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查（可选）
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
