server {
    listen       80;
    server_name  F1RacingHub.com www.F1RacingHub.com;

    # Let's Encrypt 证书验证路径（certbot --webroot 模式需要）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # SPA 路由回退：刷新子页面时返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的 JS/CSS/图片）
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代：/api/* -> backend:8000/api/*
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查（可选）
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
