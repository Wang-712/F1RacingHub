# =============================================================
# F1 Racing Hub - Docker Compose 编排
# 服务：
#   - backend : FastAPI (uvicorn)  :8000（仅内部网络）
#   - frontend: Nginx 托管 SPA + /api 反代  :80 / :443
# =============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1-backend
    restart: unless-stopped
    environment:
      # 生产环境 CORS：同源部署无需跨域，保留空即可
      - CORS_ORIGINS=
    networks:
      - f1-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      # Nginx 配置（可在宿主机修改后重启容器生效）
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt 证书目录（宿主机 /etc/letsencrypt -> 容器 /etc/nginx/ssl）
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      # ACME 验证目录（certbot webroot 模式写入）
      - ./certbot-webroot:/usr/share/nginx/html/.well-known/acme-challenge:rw
    networks:
      - f1-net

networks:
  f1-net:
    driver: bridge
